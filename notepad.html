<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DR4G0N-TYP3 · NOTEPAD</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Rajdhani:wght@500;700;900&family=Noto+Serif+Tamil:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1b1b1b;--panel:#151515;--border:#2a2a2a;--gold:#c9a84c;--text:#eee;--muted:#888;
  --page-bg:#ffffff;--page-text:#1a1a1a;--page-shadow:0 6px 24px rgba(0,0,0,.35);
}
body.dark-chrome{--bg:#050505;--panel:#0e0e0e;--border:#232323;--text:#eee;--muted:#777}
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;display:flex;flex-direction:column;overflow:hidden}
header{min-height:58px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.8rem;padding:.6rem 1rem;flex-wrap:wrap}
.logo{font-family:'Rajdhani',sans-serif;font-weight:900;color:var(--gold);letter-spacing:.2em}
#timer{font-family:'Rajdhani',sans-serif;font-weight:900;font-size:1.15rem;color:var(--gold);min-width:56px;text-align:center;letter-spacing:.05em}
.sep{width:1px;height:20px;background:var(--border)}
.right{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.btn,.sel{font-family:'Space Mono',monospace;font-size:.58rem;letter-spacing:.1em;color:var(--text);background:var(--bg);border:1px solid var(--border);padding:.35rem .65rem;cursor:pointer}
.btn:hover{color:var(--gold);border-color:var(--gold)}
main{flex:1;display:flex;flex-direction:column;min-height:0}
.label{padding:.45rem 1rem;background:var(--panel);border-bottom:1px solid var(--border);font-size:.55rem;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}
.paperWrap{flex:1;min-height:0;display:flex;flex-direction:column;background:#3c3c3c;overflow:auto;padding:2.2rem 1rem}
.page{background:var(--page-bg);color:var(--page-text);width:100%;max-width:820px;margin:0 auto;min-height:100%;box-shadow:var(--page-shadow);padding:64px 68px;font-family:'Noto Serif Tamil',serif;font-size:22px;line-height:1.95;white-space:pre-wrap;word-break:break-word}
.page.empty{color:#9a9a9a;font-style:italic}
.stroke{display:inline;animation:strokeIn .16s ease-out}
@keyframes strokeIn{from{opacity:0;filter:blur(1.5px)}to{opacity:1;filter:blur(0)}}
.inputWrap{height:116px;background:var(--panel);border-top:1px solid var(--border);display:flex;flex-direction:column}
.inputHead{padding:.35rem 1rem;border-bottom:1px solid var(--border);font-size:.52rem;letter-spacing:.18em;color:var(--muted);display:flex;justify-content:space-between}
.inputHead b{color:var(--gold);font-weight:700}
#raw{flex:1;width:100%;border:0;outline:0;resize:none;background:var(--panel);color:var(--text);caret-color:var(--gold);font-family:'Space Mono',monospace;font-size:18px;line-height:1.55;padding:.65rem 1rem}
@media(max-width:850px){header{align-items:flex-start}.right{margin-left:0}.page{font-size:20px;padding:40px 28px}.inputWrap{height:128px}}
</style>
</head>
<body>
<header>
  <div class="logo">DR4G0N-TYP3 NOTEPAD</div>
  <div class="sep"></div>
  <div id="timer">0:00</div>
  <div class="right">
    <select id="mode" class="sel" onchange="render()">
      <option value="tamil">Tamil keys → Tamil</option>
      <option value="english">English normal</option>
    </select>
    <select id="font" class="sel" onchange="applyFont()">
      <option value="'Noto Serif Tamil',serif">Noto Serif Tamil</option>
      <option value="'Noto Sans Tamil',sans-serif">Noto Sans Tamil</option>
      <option value="'Inter',sans-serif">Inter</option>
      <option value="'Space Mono',monospace">Space Mono</option>
      <option value="serif">System Serif</option>
      <option value="sans-serif">System Sans</option>
    </select>
    <button class="btn" onclick="size(-2)">−</button>
    <button class="btn" onclick="size(2)">+</button>
    <button class="btn" onclick="copyOut()">COPY</button>
    <button class="btn" onclick="clearAll()">CLEAR</button>
    <button id="chrome" class="btn" onclick="toggleChrome()">DARK CHROME</button>
    <button class="btn" onclick="location.href='index.html'">MENU</button>
  </div>
</header>
<main>
  <section class="paperWrap">
    <div id="out" class="page empty">Start typing in the small box below...</div>
  </section>
  <section class="inputWrap">
    <div class="inputHead"><span>TYPE HERE</span><b id="modeText">TAMIL MODE</b></div>
    <textarea id="raw" placeholder="Tamil mode: type keys like peidth;ww;y  |  English mode: normal typing" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
  </section>
</main>
<script src="js/engine.js"></script>
<script>
const raw=document.getElementById('raw'),out=document.getElementById('out'),mode=document.getElementById('mode'),timerEl=document.getElementById('timer');
let fs=22;let savedText='';let lastMode=mode.value;
let renderedPlain='';
let startTime=null,timerInterval=null;

function convertByMode(v,m){return m==='english'?v:transliterate(v).text}
function currentText(){return savedText+convertByMode(raw.value,mode.value)}

function startTimerIfNeeded(){
  if(startTime) return;
  startTime=Date.now();
  timerInterval=setInterval(updateTimer,250);
}
function updateTimer(){
  if(!startTime) return;
  const el=Math.floor((Date.now()-startTime)/1000);
  const m=Math.floor(el/60),s=el%60;
  timerEl.textContent=m+':'+String(s).padStart(2,'0');
}
function stopTimer(){
  clearInterval(timerInterval);
  timerInterval=null;startTime=null;
  timerEl.textContent='0:00';
}

function escapeHTML(s){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}

// Renders the page. If the new text is just the old text plus an addition,
// only the new tail gets wrapped in an animated "stroke" span, so already
// visible letters never re-animate. Anything else (delete/edit/mode switch)
// gets a plain full re-render.
function paint(full){
  if(full===renderedPlain) return;
  if(full && full.startsWith(renderedPlain)){
    const added=full.slice(renderedPlain.length);
    if(out.classList.contains('empty')){ out.innerHTML=''; out.classList.remove('empty'); }
    const span=document.createElement('span');
    span.className='stroke';
    span.textContent=added;
    out.appendChild(span);
  } else {
    out.innerHTML='';
    if(full){
      const span=document.createElement('span');
      span.textContent=full;
      out.appendChild(span);
    } else {
      out.classList.add('empty');
      out.textContent='Start typing in the small box below...';
    }
  }
  renderedPlain=full;
  out.scrollTop=out.scrollHeight;
}

function render(){
  const m=mode.value;
  document.getElementById('modeText').textContent=m==='tamil'?'TAMIL MODE':'ENGLISH MODE';
  const text=currentText();
  if(text) startTimerIfNeeded();
  paint(text);
}
function commitCurrent(){
  const part=convertByMode(raw.value,lastMode);
  if(part){savedText+=part}
  raw.value=''
}
function changeModeKeepText(){commitCurrent();lastMode=mode.value;render();raw.focus()}
function applyFont(){out.style.fontFamily=document.getElementById('font').value}
function size(d){fs=Math.max(14,Math.min(52,fs+d));out.style.fontSize=fs+'px'}
function copyOut(){navigator.clipboard&&navigator.clipboard.writeText(out.classList.contains('empty')?'':currentText())}
function clearAll(){
  savedText='';raw.value='';lastMode=mode.value;
  renderedPlain='';
  stopTimer();
  render();raw.focus()
}
function toggleChrome(){
  document.body.classList.toggle('dark-chrome');
  document.getElementById('chrome').textContent=document.body.classList.contains('dark-chrome')?'LIGHT CHROME':'DARK CHROME';
}
raw.addEventListener('input',render);
mode.addEventListener('change',changeModeKeepText);
applyFont();render();raw.focus();
</script>
</body>
</html>
