<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DR4G0N-TYP3 · NOTEPAD</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Rajdhani:wght@500;700;900&family=Noto+Serif+Tamil:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161616;--panel:#111;--border:#2a2a2a;--gold:#c9a84c;--text:#eee;--muted:#888;
}
*{box-sizing:border-box;margin:0;padding:0}
body{height:100vh;background:var(--bg);color:var(--text);font-family:'Space Mono',monospace;display:flex;flex-direction:column;overflow:hidden}
header{min-height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.8rem;padding:.55rem 1rem;flex-wrap:wrap}
.logo{font-family:'Rajdhani',sans-serif;font-weight:900;color:var(--gold);letter-spacing:.2em;font-size:.95rem}
#timer{font-family:'Rajdhani',sans-serif;font-weight:900;font-size:1.1rem;color:var(--gold);min-width:52px;text-align:center;letter-spacing:.05em}
.sep{width:1px;height:20px;background:var(--border)}
.right{margin-left:auto;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.btn,.sel{font-family:'Space Mono',monospace;font-size:.56rem;letter-spacing:.1em;color:var(--text);background:var(--bg);border:1px solid var(--border);padding:.32rem .6rem;cursor:pointer}
.btn:hover{color:var(--gold);border-color:var(--gold)}

/* Everything below the header is one full-bleed white page. */
main{flex:1;min-height:0;background:#fff;overflow:auto;cursor:text}
#page{
  max-width:900px;margin:0 auto;min-height:100%;
  padding:70px 60px 200px;
  color:#1a1a1a;font-family:'Noto Serif Tamil',serif;font-size:24px;line-height:1.95;
  white-space:pre-wrap;word-break:break-word;
}
#page.empty{color:#b5b5b5;font-style:italic}
.stroke{display:inline;animation:strokeIn .16s ease-out}
@keyframes strokeIn{from{opacity:0;filter:blur(1.5px)}to{opacity:1;filter:blur(0)}}
.caret{display:inline-block;width:2px;height:1em;background:#1a1a1a;vertical-align:text-bottom;animation:blink 1s step-end infinite;margin-left:1px}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

/* The real textarea exists only to capture keystrokes — it is never seen. */
#raw{position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;border:0;outline:0;padding:0;resize:none;pointer-events:none}
@media(max-width:850px){#page{font-size:20px;padding:40px 24px 160px}}
</style>
</head>
<body>
<header>
  <div class="logo">DR4G0N-TYP3 NOTEPAD</div>
  <div class="sep"></div>
  <div id="timer">0:00</div>
  <div class="right">
    <select id="mode" class="sel" onchange="render()">
      <option value="tamil">Tamil keys → Tamil</option>
      <option value="english">English normal</option>
    </select>
    <select id="font" class="sel" onchange="applyFont()">
      <option value="'Noto Serif Tamil',serif">Noto Serif Tamil</option>
      <option value="'Noto Sans Tamil',sans-serif">Noto Sans Tamil</option>
      <option value="'Inter',sans-serif">Inter</option>
      <option value="'Space Mono',monospace">Space Mono</option>
      <option value="serif">System Serif</option>
      <option value="sans-serif">System Sans</option>
    </select>
    <button class="btn" onclick="size(-2)">−</button>
    <button class="btn" onclick="size(2)">+</button>
    <button class="btn" onclick="copyOut()">COPY</button>
    <button class="btn" onclick="clearAll()">CLEAR</button>
    <button class="btn" onclick="location.href='index.html'">MENU</button>
  </div>
</header>
<main id="main">
  <div id="page" class="empty">Click here and start typing...</div>
</main>
<textarea id="raw" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
<script src="js/engine.js"></script>
<script>
const raw=document.getElementById('raw'),page=document.getElementById('page'),mode=document.getElementById('mode'),timerEl=document.getElementById('timer'),mainEl=document.getElementById('main');
let fs=24;let savedText='';let lastMode=mode.value;
let renderedPlain='';
let startTime=null,timerInterval=null;

function convertByMode(v,m){return m==='english'?v:transliterate(v).text}
function currentText(){return savedText+convertByMode(raw.value,mode.value)}

function startTimerIfNeeded(){
  if(startTime) return;
  startTime=Date.now();
  timerInterval=setInterval(updateTimer,250);
}
function updateTimer(){
  if(!startTime) return;
  const el=Math.floor((Date.now()-startTime)/1000);
  const m=Math.floor(el/60),s=el%60;
  timerEl.textContent=m+':'+String(s).padStart(2,'0');
}
function stopTimer(){
  clearInterval(timerInterval);
  timerInterval=null;startTime=null;
  timerEl.textContent='0:00';
}

function placeCaret(){
  const c=document.createElement('span');
  c.className='caret';
  page.appendChild(c);
}

// Renders the page. If the new text is just the old text plus an addition,
// only the new tail gets wrapped in an animated "stroke" span, so already
// visible letters never re-animate. Anything else (delete/edit/mode switch)
// gets a plain full re-render. A blinking caret always sits at the end.
function paint(full){
  if(full===renderedPlain) return;
  if(full && full.startsWith(renderedPlain)){
    const added=full.slice(renderedPlain.length);
    if(page.classList.contains('empty')){ page.innerHTML=''; page.classList.remove('empty'); }
    else { const oldCaret=page.querySelector('.caret'); if(oldCaret) oldCaret.remove(); }
    const span=document.createElement('span');
    span.className='stroke';
    span.textContent=added;
    page.appendChild(span);
    placeCaret();
  } else {
    page.innerHTML='';
    if(full){
      const span=document.createElement('span');
      span.textContent=full;
      page.appendChild(span);
      placeCaret();
    } else {
      page.classList.add('empty');
      page.textContent='Click here and start typing...';
    }
  }
  renderedPlain=full;
  mainEl.scrollTop=mainEl.scrollHeight;
}

function render(){
  const text=currentText();
  if(text) startTimerIfNeeded();
  paint(text);
}
function commitCurrent(){
  const part=convertByMode(raw.value,lastMode);
  if(part){savedText+=part}
  raw.value=''
}
function changeModeKeepText(){commitCurrent();lastMode=mode.value;render();raw.focus()}
function applyFont(){page.style.fontFamily=document.getElementById('font').value}
function size(d){fs=Math.max(14,Math.min(52,fs+d));page.style.fontSize=fs+'px'}
function copyOut(){navigator.clipboard&&navigator.clipboard.writeText(page.classList.contains('empty')?'':currentText())}
function clearAll(){
  savedText='';raw.value='';lastMode=mode.value;
  renderedPlain='';
  stopTimer();
  render();raw.focus()
}
raw.addEventListener('input',render);
mode.addEventListener('change',changeModeKeepText);
mainEl.addEventListener('click',()=>raw.focus());
document.addEventListener('keydown',()=>raw.focus());
applyFont();render();raw.focus();
</script>
</body>
</html>
